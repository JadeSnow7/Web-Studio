# Candidate only. Do not install into Vendor/ghostty/web-studio.conf.
# Values mirror the VT host's explicit geometry/theme constants where Ghostty
# exposes an equivalent setting. Actual Ghostty cell metrics still require a
# launched surface measurement.
font-family = ".AppleSystemUIFontMonospaced"
font-size = 13
window-padding-x = 16
window-padding-y = 12
adjust-cell-width = 0
adjust-cell-height = 0
background = #252A2E
foreground = #D8DEE4
cursor-color = #D8DEE4
selection-background = #46515B
window-vsync = false
